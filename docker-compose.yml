services:
  postgres:
    image: postgres:16-alpine
    container_name: cadastro-credito-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-credito_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credito_pass}
      POSTGRES_DB: ${POSTGRES_DB:-cadastro_credito}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-credito_user} -d ${POSTGRES_DB:-cadastro_credito}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: cadastro-credito-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro da rede do compose o Postgres é acessado pelo nome do serviço,
      # não por localhost:${POSTGRES_PORT} (isso sobrescreve o DATABASE_URL do .env).
      DATABASE_URL: postgresql://${POSTGRES_USER:-credito_user}:${POSTGRES_PASSWORD:-credito_pass}@postgres:5432/${POSTGRES_DB:-cadastro_credito}?schema=public
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - ./backend:/app/backend
      - backend_node_modules:/app/backend/node_modules
      - backend_root_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: cadastro-credito-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
      - frontend_root_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_node_modules:
  backend_root_node_modules:
  frontend_node_modules:
  frontend_root_node_modules:
